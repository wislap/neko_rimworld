[plugin_runtime]
enabled = true
auto_start = false

[neko_rimworld]
# Must match the token configured in RimWorld's Mod Settings. Generate at least
# 32 random characters. It is used as an HMAC key and is never sent on the wire.
pairing_token = ""
port = 48919

# Recent sanitized operational events shown by the Hosted TSX panel.
diagnostic_log_capacity = 200

[neko_rimworld.agent]
# Plugin-owned, OpenAI-compatible Chat Completions endpoint. This model runs an
# isolated ReAct session and does not reuse the N.E.K.O character agent.
base_url = ""
model = ""
api_key = ""
request_timeout_seconds = 60.0
connect_timeout_seconds = 10.0
first_response_timeout_seconds = 45.0
stream_idle_timeout_seconds = 20.0
finalization_reserve_seconds = 15.0
stream_include_usage = true
run_budget_seconds = 900.0
max_model_calls = 60
max_input_tokens = 2000000
max_output_tokens = 32768
temperature = 0.2

[neko_rimworld.autoplay]
# Cumulative limits across runs; prices are per million tokens.
max_requests = 100000
max_input_tokens = 1000000000
